# cargo-deny config for the §42 quality gate ("cargo deny check").
# Run: `cargo deny check` (all four sections) or `cargo deny check <section>`.

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# ---------------------------------------------------------------- advisories
[advisories]
ignore = []

# ------------------------------------------------------------------ licenses
[licenses]
# Every license actually present in this workspace's dependency graph, as
# of the last `cargo deny check licenses` run. A new dependency pulling in
# something outside this list should fail the check rather than pass
# silently — extend this list deliberately, not by copying a template.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.8

[licenses.private]
# Our own crates are internal ELCI tooling (`publish = false`, license
# "UNLICENSED" — not a valid SPDX expression) and must not be run through
# the public-license allow list above.
ignore = true

# ---------------------------------------------------------------------- bans
[bans]
# Two `windows-sys` versions currently coexist (via `rustix`/`tempfile` vs.
# `clap`'s `anstream`) — a real duplicate, but a transitive-dependency
# version skew rather than something this workspace controls, so it warns
# rather than fails the gate.
multiple-versions = "warn"
wildcards = "allow"
allow-workspace = true

# -------------------------------------------------------------------- sources
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
